<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<link rel="stylesheet" href="/_app/files.css">
<script src="/_app/files.js" defer></script>
<main>
  <header><a id="location" title="Choose a file or folder"></a><span id="label">Files</span></header>
  <section id="picker" hidden>
    <form id="path-form"><button id="up" type="button" title="Parent folder" aria-label="Parent folder">↑</button><input id="path" aria-label="File or folder path" spellcheck="false" autocomplete="off"><button id="open" type="button">Open</button></form>
    <label id="hidden-toggle"><input id="show-hidden" type="checkbox"> Show hidden files</label>
    <div id="listing" aria-label="Files and folders"></div>
  </section>
  <section id="viewer" hidden></section>
  <p id="notice" role="status"></p>
</main>
</html>
